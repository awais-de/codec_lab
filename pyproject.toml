[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codeclab"
version = "0.1.0"
description = "Shared code for the codec-lab quantization experiment suite"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5,<3",
    "matplotlib>=3.11,<4",
    "pyyaml>=6.0,<7",
]

[project.optional-dependencies]
neural = ["torch>=2.3"]
theory = ["scipy>=1.18,<2"]
speech = ["pesq>=0.0.4", "pystoi>=0.4.1", "torchmetrics>=1.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/codeclab"]
